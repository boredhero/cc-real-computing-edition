modLoader="javafml"
loaderVersion="[1,)"

issueTrackerURL="https://github.com/boredhero/cc-real-computing-edition/issues"
logoFile="pack.png"

license="ComputerCraft Public License (https://raw.githubusercontent.com/dan200/ComputerCraft/master/LICENSE)"

[[mods]]
modId="computercraft"
version="${file.jarVersion}"
displayName="CC: Real Computing Edition"
displayURL="https://github.com/boredhero/cc-real-computing-edition"

credits="Created by Daniel Ratcliffe (@DanTwoHundred)"
authors="Daniel Ratcliffe, Aaron Mills, SquidDev"
description='''
An independent CC: Tweaked fork targeting more capable computation and turtle automation.
Independent background Lua compute workers with message passing and configurable budgets.
Cached turtle block vision with change events and diagonal targeted digging, placement and block use.
Persistent computer, turtle and pocket UUIDs with UUID rednet and independent clone storage.
Denser computer/turtle terminal UIs.
'''

[[dependencies.computercraft]]
    modId="neoforge"
    type="required"
    versionRange="[${neoVersion},21.2)"
    ordering="NONE"
    side="BOTH"

[[mixins]]
config = "computercraft.mixins.json"

[[mixins]]
config = "computercraft.forge.mixins.json"

[[mixins]]
config = "computercraft-client.forge.mixins.json"
