name: Build Real Computing Edition

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  neoforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Build NeoForge and run unit tests
        run: ./gradlew :forge:assemble :core:test :forge:test
      - uses: actions/upload-artifact@v7
        with:
          name: cc-real-computing-edition-neoforge-1.21.1
          path: projects/forge/build/libs/cc-real-computing-edition-*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: projects/*/build/reports/tests/
